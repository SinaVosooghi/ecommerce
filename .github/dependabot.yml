version: 2
updates:
  - package-ecosystem: gomod
    directory: /services/cart-service
    schedule:
      interval: weekly
    groups:
      aws-sdk:
        patterns: ["github.com/aws/*"]
      golang-x:
        patterns: ["golang.org/x/*"]

  - package-ecosystem: docker
    directory: /services/cart-service
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: terraform
    directories:
      - /infrastructure/backend
      - /infrastructure/environments/dev
      - /infrastructure/environments/prod
    schedule:
      interval: weekly
