# CodeBuild spec for the cart-service image. The CodePipeline source is the whole
# repository, so commands first change into the service directory.
version: 0.2

env:
  shell: bash
  variables:
    SERVICE_NAME: "cart-service"
    SERVICE_DIR: "services/cart-service"
    GOLANGCI_LINT_VERSION: "v2.14.0"
  parameter-store:
    DOCKER_HUB_USER: "/codebuild/docker-hub-user"
    DOCKER_HUB_TOKEN: "/codebuild/docker-hub-token"
  exported-variables:
    - IMAGE_TAG
    - IMAGE_URI

phases:
  install:
    commands:
      - set -o pipefail
      - cd "$CODEBUILD_SRC_DIR/$SERVICE_DIR"
      # Install exactly the Go version declared in go.mod instead of relying on the
      # versions preinstalled in the CodeBuild image.
      - GO_VERSION=$(sed -n 's/^go //p' go.mod)
      - echo "Installing Go ${GO_VERSION}..."
      - mkdir -p /opt/go && curl -sSfL "https://go.dev/dl/go${GO_VERSION}.linux-amd64.tar.gz" | tar -C /opt/go -xz --strip-components=1
      - export PATH="/opt/go/bin:$(/opt/go/bin/go env GOPATH)/bin:$PATH"
      - go version
      - go install "github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${GOLANGCI_LINT_VERSION}"

  pre_build:
    commands:
      - echo "Pre-build phase started at $(date)"
      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com"
      # Authenticated pulls avoid Docker Hub rate limits for the base images.
      - echo "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USER" --password-stdin

      # Images are tagged by commit only; there is no mutable "latest" tag.
      - export IMAGE_TAG=${CODEBUILD_RESOLVED_SOURCE_VERSION:0:8}
      - export IMAGE_URI=$AWS_ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com/$SERVICE_NAME:$IMAGE_TAG

      - echo "Downloading Go modules..."
      - go mod download
      - go mod verify

  build:
    commands:
      - echo "Build phase started at $(date)"

      - echo "Running linter..."
      - golangci-lint run ./...

      - echo "Running tests..."
      - go test -race -count=1 -coverprofile=coverage.out ./...
      - go tool cover -func=coverage.out | tail -1

      - echo "Scanning for known vulnerabilities..."
      - go tool govulncheck ./...

      - echo "Building Docker image..."
      - docker build --build-arg VERSION="$IMAGE_TAG" -t "$IMAGE_URI" .

  post_build:
    commands:
      - echo "Post-build phase started at $(date)"

      - echo "Pushing Docker image..."
      - docker push "$IMAGE_URI"

      # Create image definitions file for ECS
      - echo "Creating imagedefinitions.json..."
      - printf '[{"name":"%s","imageUri":"%s"}]' "$SERVICE_NAME" "$IMAGE_URI" > imagedefinitions.json

      # Create appspec.yml for CodeDeploy
      - echo "Creating appspec.yml..."
      - |
        cat > appspec.yml << EOF
        version: 0.0
        Resources:
          - TargetService:
              Type: AWS::ECS::Service
              Properties:
                TaskDefinition: <TASK_DEFINITION>
                LoadBalancerInfo:
                  ContainerName: "$SERVICE_NAME"
                  ContainerPort: 8080
        EOF

      - echo "Build completed at $(date)"

artifacts:
  base-directory: services/cart-service
  files:
    - imagedefinitions.json
    - appspec.yml
  discard-paths: no

cache:
  paths:
    - '/root/go/pkg/mod/**/*'
