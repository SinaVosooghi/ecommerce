# Local development stack: the service, DynamoDB Local (with the cart table created on
# startup) and a DynamoDB admin UI on http://localhost:8001.
#
#   docker compose up --build
services:
  cart-service:
    build:
      context: .
    ports:
      - "8080:8080"
    environment:
      - ENV_NAME=dev
      - APP_PORT=8080
      - LOG_LEVEL=debug
      - AWS_REGION=us-east-1
      - DYNAMODB_ENDPOINT=http://dynamodb-local:8000
      - DYNAMODB_TABLE=cart-service-carts
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
      - EVENTBRIDGE_ENABLED=false
      # Local only: auth is off so the API can be called without minting tokens.
      # Set AUTH_ENABLED=true to exercise JWT auth with the dev key below.
      - AUTH_ENABLED=false
      - JWT_SECRET_KEY=local-dev-only-secret-change-me-0123456789
    depends_on:
      dynamodb-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "/cart-service", "-health-check"]
      interval: 10s
      timeout: 5s
      retries: 3

  dynamodb-local:
    image: amazon/dynamodb-local:3.3.1
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    ports:
      - "8000:8000"

  # DynamoDB Local starts empty; create the cart table (same keys as the Terraform table).
  dynamodb-init:
    image: amazon/aws-cli:2.37.8
    depends_on:
      - dynamodb-local
    environment:
      - AWS_REGION=us-east-1
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        endpoint=http://dynamodb-local:8000
        for _ in $$(seq 1 30); do
          aws dynamodb list-tables --endpoint-url "$$endpoint" >/dev/null 2>&1 && break
          sleep 1
        done
        aws dynamodb describe-table --endpoint-url "$$endpoint" --table-name cart-service-carts >/dev/null 2>&1 ||
          aws dynamodb create-table --endpoint-url "$$endpoint" \
            --table-name cart-service-carts \
            --attribute-definitions AttributeName=PK,AttributeType=S AttributeName=SK,AttributeType=S \
            --key-schema AttributeName=PK,KeyType=HASH AttributeName=SK,KeyType=RANGE \
            --billing-mode PAY_PER_REQUEST >/dev/null
        echo "cart-service-carts table ready"

  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:5.3.4
    ports:
      - "8001:8001"
    environment:
      - DYNAMO_ENDPOINT=http://dynamodb-local:8000
      - AWS_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=local
      - AWS_SECRET_ACCESS_KEY=local
    depends_on:
      - dynamodb-local
