# golangci-lint v2 configuration. Run with `make lint`.
version: "2"

run:
  timeout: 5m

linters:
  # errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - gosec
    - misspell
    - revive
  settings:
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: exported
          # Renaming cart.CartItem etc. is not worth the API churn.
          arguments: ["disableStutteringCheck"]
        - name: increment-decrement
        - name: var-declaration
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - std-error-handling
    rules:
      # Tests may use weak randomness, unchecked casts and fixed secrets.
      - path: _test\.go
        linters:
          - gosec
          - contextcheck

formatters:
  enable:
    - gofumpt
